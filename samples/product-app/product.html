<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopDemo - Product Detail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    header { background: #1a73e8; color: white; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.5rem; }
    header nav a { color: white; text-decoration: none; margin-left: 20px; }
    .cart-badge { background: #ff4500; color: white; border-radius: 50%; padding: 2px 7px; font-size: 0.8rem; margin-left: 4px; }
    .breadcrumb { padding: 12px 32px; background: white; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
    .breadcrumb a { color: #1a73e8; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span { color: #888; margin: 0 6px; }
    main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
    .product-detail { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; gap: 40px; padding: 32px; }
    .product-image { flex: 0 0 320px; height: 320px; background: #c7d9f9; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 6rem; }
    .product-info { flex: 1; }
    .product-info h2 { font-size: 1.8rem; margin-bottom: 12px; }
    .product-info .price { font-size: 1.6rem; color: #1a73e8; font-weight: 700; margin-bottom: 16px; }
    .product-info .description { color: #555; line-height: 1.6; margin-bottom: 24px; }
    .qty-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .qty-selector label { font-weight: 600; }
    .qty-selector button { width: 36px; height: 36px; border: 1px solid #ccc; background: white; border-radius: 4px; font-size: 1.2rem; cursor: pointer; }
    .qty-selector button:hover { background: #f0f0f0; }
    .qty-selector input { width: 60px; text-align: center; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .btn { padding: 12px 32px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .btn:hover { background: #1558b0; }
    .added-msg { display: none; color: green; margin-top: 12px; font-weight: 600; }
    footer { text-align: center; padding: 32px; color: #888; font-size: 0.9rem; margin-top: 40px; border-top: 1px solid #ddd; background: white; }
  </style>
</head>
<body>
  <header>
    <h1>ShopDemo</h1>
    <nav>
      <a href="index.html">Products</a>
      <a href="cart.html">Cart <span class="cart-badge" id="cart-count">0</span></a>
    </nav>
  </header>

  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <span>/</span>
    <a href="index.html">Products</a>
    <span>/</span>
    <span id="breadcrumb-name">Product</span>
  </div>

  <main>
    <div class="product-detail">
      <div class="product-image" id="product-icon">🛍️</div>
      <div class="product-info">
        <h2 id="product-title">Product</h2>
        <div class="price" id="product-price">$0.00</div>
        <p class="description" id="product-description">Loading product information...</p>

        <div class="qty-selector">
          <label for="qty">Quantity:</label>
          <button id="qty-dec" aria-label="Decrease quantity">−</button>
          <input type="number" id="qty" value="1" min="1" max="99" aria-label="Quantity" />
          <button id="qty-inc" aria-label="Increase quantity">+</button>
        </div>

        <button class="btn" id="add-to-cart">Add to Cart</button>
        <div class="added-msg" id="added-msg">Added to cart!</div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 ShopDemo Inc. All rights reserved.
  </footer>

  <script>
    const products = {
      '1': { name: 'Wireless Headphones', price: 79.99, icon: '🎧', description: 'Premium wireless headphones with active noise cancellation, 30-hour battery life, and comfortable over-ear design. Compatible with all Bluetooth devices.' },
      '2': { name: 'Mechanical Keyboard', price: 129.99, icon: '⌨️', description: 'Full-size mechanical keyboard with tactile switches, RGB backlighting, and a durable aluminum frame. Ideal for gaming and professional use.' },
      '3': { name: 'USB-C Hub', price: 49.99, icon: '🔌', description: '7-in-1 USB-C hub featuring 4K HDMI, 3× USB-A 3.0, SD card reader, and 100W Power Delivery pass-through.' },
      '4': { name: 'Webcam HD', price: 89.99, icon: '📷', description: '1080p HD webcam with built-in stereo microphones, auto-focus, and wide-angle lens. Perfect for video calls and streaming.' },
    };

    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '1';
    const product = products[id] || products['1'];

    document.getElementById('product-icon').textContent = product.icon;
    document.getElementById('product-title').textContent = product.name;
    document.getElementById('product-price').textContent = '$' + product.price.toFixed(2);
    document.getElementById('product-description').textContent = product.description;
    document.getElementById('breadcrumb-name').textContent = product.name;
    document.title = 'ShopDemo - ' + product.name;

    // Quantity selector.
    const qtyInput = document.getElementById('qty');
    document.getElementById('qty-dec').addEventListener('click', () => {
      const v = parseInt(qtyInput.value);
      if (v > 1) qtyInput.value = v - 1;
    });
    document.getElementById('qty-inc').addEventListener('click', () => {
      const v = parseInt(qtyInput.value);
      if (v < 99) qtyInput.value = v + 1;
    });

    // Cart.
    function getCart() { return JSON.parse(sessionStorage.getItem('cart') || '[]'); }
    function saveCart(c) { sessionStorage.setItem('cart', JSON.stringify(c)); }
    function updateBadge() {
      const n = getCart().reduce((s, i) => s + i.qty, 0);
      document.getElementById('cart-count').textContent = n;
    }

    document.getElementById('add-to-cart').addEventListener('click', () => {
      const qty = parseInt(qtyInput.value) || 1;
      const cart = getCart();
      const existing = cart.find(i => i.id === id);
      if (existing) { existing.qty += qty; }
      else { cart.push({ id, name: product.name, price: product.price, qty }); }
      saveCart(cart);
      updateBadge();
      const msg = document.getElementById('added-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2000);
    });

    updateBadge();
  </script>
</body>
</html>

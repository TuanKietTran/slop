<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopDemo - Cart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    header { background: #1a73e8; color: white; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.5rem; }
    header nav a { color: white; text-decoration: none; margin-left: 20px; }
    .cart-badge { background: #ff4500; color: white; border-radius: 50%; padding: 2px 7px; font-size: 0.8rem; margin-left: 4px; }
    main { max-width: 800px; margin: 32px auto; padding: 0 16px; }
    h2 { margin-bottom: 24px; font-size: 1.4rem; }
    .cart-empty { text-align: center; padding: 60px 0; color: #888; }
    .cart-empty a { color: #1a73e8; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 24px; }
    th { background: #f8f8f8; padding: 14px 16px; text-align: left; font-weight: 600; border-bottom: 1px solid #eee; }
    td { padding: 14px 16px; border-bottom: 1px solid #eee; }
    tr:last-child td { border-bottom: none; }
    .remove-btn { background: none; border: none; color: #cc0000; cursor: pointer; font-size: 0.9rem; }
    .remove-btn:hover { text-decoration: underline; }
    .totals { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; max-width: 340px; margin-left: auto; }
    .totals-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .totals-row.total { font-weight: 700; font-size: 1.15rem; border-top: 1px solid #ddd; padding-top: 12px; margin-top: 4px; }
    .btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 16px; }
    .btn:hover { background: #1558b0; }
    .checkout-msg { display: none; text-align: center; color: green; font-weight: 600; margin-top: 12px; }
    footer { text-align: center; padding: 32px; color: #888; font-size: 0.9rem; margin-top: 40px; border-top: 1px solid #ddd; background: white; }
  </style>
</head>
<body>
  <header>
    <h1>ShopDemo</h1>
    <nav>
      <a href="index.html">Products</a>
      <a href="cart.html">Cart <span class="cart-badge" id="cart-count">0</span></a>
    </nav>
  </header>

  <main>
    <h2>Shopping Cart</h2>

    <div id="cart-empty" class="cart-empty" style="display:none;">
      <p>Your cart is empty. <a href="index.html">Continue shopping</a>.</p>
    </div>

    <div id="cart-content">
      <table id="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>

      <div class="totals">
        <div class="totals-row">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="totals-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>
        <div class="totals-row total">
          <span>Total</span>
          <span id="total">$0.00</span>
        </div>
        <button class="btn" id="checkout-btn">Checkout</button>
        <div class="checkout-msg" id="checkout-msg">Order placed! Thank you.</div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 ShopDemo Inc. All rights reserved.
  </footer>

  <script>
    function getCart() { return JSON.parse(sessionStorage.getItem('cart') || '[]'); }
    function saveCart(c) { sessionStorage.setItem('cart', JSON.stringify(c)); }

    function renderCart() {
      const cart = getCart();
      const badge = document.getElementById('cart-count');
      const totalItems = cart.reduce((s, i) => s + i.qty, 0);
      badge.textContent = totalItems;

      if (cart.length === 0) {
        document.getElementById('cart-empty').style.display = 'block';
        document.getElementById('cart-content').style.display = 'none';
        return;
      }
      document.getElementById('cart-empty').style.display = 'none';
      document.getElementById('cart-content').style.display = 'block';

      const tbody = document.getElementById('cart-body');
      tbody.innerHTML = '';
      let subtotal = 0;
      cart.forEach(item => {
        const sub = item.price * item.qty;
        subtotal += sub;
        const tr = document.createElement('tr');
        tr.setAttribute('data-id', item.id);
        tr.innerHTML = `
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>${item.qty}</td>
          <td>$${sub.toFixed(2)}</td>
          <td><button class="remove-btn" data-id="${item.id}">Remove</button></td>
        `;
        tbody.appendChild(tr);
      });
      document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
      document.getElementById('total').textContent = '$' + subtotal.toFixed(2);

      tbody.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const updated = getCart().filter(i => i.id !== id);
          saveCart(updated);
          renderCart();
        });
      });
    }

    document.getElementById('checkout-btn').addEventListener('click', () => {
      saveCart([]);
      renderCart();
      const msg = document.getElementById('checkout-msg');
      msg.style.display = 'block';
    });

    renderCart();
  </script>
</body>
</html>
